<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Sophia Anne for inquiries or messages.">
    <title>Sophia Anne - Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="cssstyle.css">
</head>

<body>
<header class="p-3 text-center">
    <h1 class="fw-bold">Contact Me 📩</h1>
    <nav class="my-2">
        <a href="index.html" class="mx-2">Home</a>
        <a href="About.html" class="mx-2">About</a>
        <a href="Contact.html" class="mx-2">Contact</a>
    </nav>
</header>

<main class="container mt-4">
    <div class="card-box">
        <form id="contactForm">
            <div class="mb-3">
                <label for="name" class="form-label">Name:</label>
                <input type="text" id="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" id="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Message:</label>
                <textarea id="message" class="form-control" rows="3" required></textarea>
            </div>

            <button type="submit" class="btn btn-pink">Send</button>
        </form>

        <p id="formFeedback" class="mt-3 fw-bold"></p>
    </div>
</main>

<footer class="text-center text-white p-3 mt-4">
    © 2025 Sophia Anne
</footer>

<script src="jsscript.js"></script>
</body>
</html>
